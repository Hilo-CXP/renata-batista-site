services:
  - type: web
    name: renata-batista-site
    runtime: node
    plan: starter
    buildCommand: npm ci
    startCommand: npm run start:prod
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "24.21.0"
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SITE_URL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: NOTIFY_EMAIL
        sync: false
    disk:
      name: agenda-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1

databases: []
